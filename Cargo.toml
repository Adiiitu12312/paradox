[workspace]
members = ["crates/paradox-core", "crates/paradox-cli", "crates/paradox-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
paradox-core = { path = "crates/paradox-core" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"

# Preserve native FSEvents and timezone behavior while loading Apple's watch/
# timezone frameworks only when needed. See each vendor package's patch notes.
[patch.crates-io]
fsevent-sys = { path = "vendor/fsevent-sys" }
notify = { path = "vendor/notify" }
iana-time-zone = { path = "vendor/iana-time-zone" }
