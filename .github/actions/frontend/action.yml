name: Build embedded browser assets
description: Build local-origin UI assets before Rust embeds the distribution
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '26.4.0'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: frontend
    - run: npm run build
      shell: bash
      working-directory: frontend
