name: Verify fixed macOS performance gates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test performance --locked -- --ignored --nocapture
      - run: cargo test --release --test capture_performance --locked -- --ignored --nocapture
        if: always()
        env:
          PARADOX_PROFILE_CAPTURE: '1'
