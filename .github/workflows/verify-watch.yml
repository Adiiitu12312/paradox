name: Verify watcher behavior
on: workflow_dispatch
permissions:
  contents: read
jobs:
  watch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all
      - run: git diff --binary > preparation.patch
      - uses: actions/upload-artifact@v4
        with:
          name: watch-preparation-${{ runner.os }}
          path: preparation.patch
          retention-days: 1
      - run: cargo test --locked -p paradox-core --lib -- --nocapture
      - run: cargo test --locked -p paradox-cli --features fault-injection --test watch -- --nocapture
      - run: cargo build --release --locked -p paradox-cli
      - name: Install Windows terminal test helper on the hosted runner
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: "pywinpty>=3,<4"
      - name: Verify real foreground interruption and Git child status
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          python -u scripts/test_terminal.py "target/${{ matrix.target }}/release/paradox$suffix"
