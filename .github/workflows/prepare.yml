name: Prepare Rust formatting and lockfile
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - run: git diff --binary > preparation.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rust-preparation
          path: preparation.patch
          retention-days: 1
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --features paradox-cli/fault-injection --no-fail-fast
        if: always()
