name: Build and test Paradox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Keep the ARM64 performance host on a fixed OS release.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: always()
      - run: cargo test --workspace --locked --features paradox-cli/fault-injection
      - run: cargo build --release --locked -p paradox-cli
        id: release
      - name: Record macOS startup dependencies
        if: runner.os == 'macOS'
        run: otool -L target/${{ matrix.target }}/release/paradox
      - name: Install Windows terminal test helper on hosted runner
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: "pywinpty>=3,<4"
      - name: Verify Windows terminal colors, pager, editor and Ctrl+C
        if: runner.os == 'Windows'
        run: python scripts/test_terminal.py target/${{ matrix.target }}/release/paradox.exe
      - name: Verify terminal colors, pager, editor and Ctrl+C
        if: runner.os != 'Windows'
        run: python3 scripts/test_terminal.py target/${{ matrix.target }}/release/paradox
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: paradox-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/${{ matrix.target }}/release/paradox
            target/${{ matrix.target }}/release/paradox.exe
          if-no-files-found: error
          retention-days: 7
      - run: cargo test --release --test performance --locked -- --ignored --nocapture
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
      - run: cargo test --release --test capture_performance --locked -- --ignored --nocapture
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        env:
          PARADOX_PROFILE_CAPTURE: '1'
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  watch-footprint:
    # Separate runners keep the ten-minute idle measurement independent of
    # functional/performance load. All jobs remain required for acceptance.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure watch RSS and CPU after ten minutes idle on 50,000 tracked files
        run: cargo test --release --locked --test watch -- --ignored --nocapture
