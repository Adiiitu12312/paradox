name: Build and test Paradox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --release --test performance --locked -- --ignored --nocapture
      - run: cargo build --release --locked -p paradox-cli
      - name: Verify terminal colors, pager, editor and Ctrl+C
        if: runner.os != 'Windows'
        run: python3 scripts/test_terminal.py target/release/paradox
      - uses: actions/upload-artifact@v4
        with:
          name: paradox-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/paradox
            target/release/paradox.exe
          if-no-files-found: error
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
