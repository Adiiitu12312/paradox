name: Build and test Paradox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Keep the ARM64 performance host on a fixed OS release.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: Verify fixed-assessment aggregation and report validation
        run: python -m unittest discover -s scripts -p test_passthrough_ci.py
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: always()
      - run: cargo test --workspace --locked --features paradox-cli/fault-injection --no-fail-fast
      - run: cargo build --release --locked -p paradox-cli
        id: release
      - name: Gate native graph first-page latency on 100,000 commits
        run: cargo test --release --locked -p paradox-core --test ui_git first_graph_page_on_one_hundred_thousand_commits_is_bounded_and_fast -- --nocapture
      - name: Install hosted browser for UI integration tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test browser staging, real commits and session teardown
        shell: bash
        working-directory: frontend
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          PARADOX_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/paradox$suffix" PLAYWRIGHT_CHANNEL=chromium npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-browser-${{ runner.os }}-${{ runner.arch }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Record macOS startup dependencies
        if: runner.os == 'macOS'
        run: |
          otool -L target/${{ matrix.target }}/release/paradox | tee startup-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          linked = Path('startup-dependencies.txt').read_text()
          for framework in ('CoreFoundation.framework', 'CoreServices.framework'):
              assert framework not in linked, f'{framework} must load only on demand: {linked}'
          PY
      - name: Install Windows terminal test helper on hosted runner
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: "pywinpty>=3,<4"
      - name: Verify Windows terminal colors, pager, editor and Ctrl+C
        if: runner.os == 'Windows'
        run: python scripts/test_terminal.py target/${{ matrix.target }}/release/paradox.exe
      - name: Verify terminal colors, pager, editor and Ctrl+C
        if: runner.os != 'Windows'
        run: python3 scripts/test_terminal.py target/${{ matrix.target }}/release/paradox
      - name: Verify timeline selection, cancellation and concurrent capture on a real terminal
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          python scripts/test_timeline_terminal.py "target/${{ matrix.target }}/release/paradox$suffix"
      - name: Package the exact release binary and precompiled timing harness
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --release --test performance --locked --no-run --message-format=json > performance-build.jsonl
          cargo test --release --locked -p paradox-core --test pending --no-run --message-format=json > pending-build.jsonl
          cargo test --release --locked -p paradox-cli --test capture_performance --no-run --message-format=json > capture-build.jsonl
          mkdir -p benchmark-bin
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          cp "target/${{ matrix.target }}/release/paradox$suffix" "benchmark-bin/paradox$suffix"
          python scripts/passthrough_ci.py select performance-build.jsonl "benchmark-bin/performance-test$suffix"
          python scripts/passthrough_ci.py select pending-build.jsonl "benchmark-bin/pending-test$suffix" --target pending
          python scripts/passthrough_ci.py select capture-build.jsonl "benchmark-bin/capture-test$suffix" --target capture_performance
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: paradox-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-bin/
          if-no-files-found: error
          retention-days: 7
  capture-gate:
    # Run once per OS on fresh hosts, without compiler/browser disk activity.
    # These are strict gates: no voting, retries, or changed OS thresholds.
    needs: test
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: paradox-Linux-X64
          - os: macos-15
            artifact: paradox-macOS-ARM64
          - os: windows-latest
            artifact: paradox-Windows-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: benchmark-bin
      - name: Restore executable permissions
        if: runner.os != 'Windows'
        run: chmod +x benchmark-bin/paradox benchmark-bin/pending-test benchmark-bin/capture-test
      - name: Gate release capture and contended handoff on the exact built binary
        shell: bash
        env:
          PARADOX_PROFILE_CAPTURE: '1'
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          python scripts/capture_ci.py "benchmark-bin/pending-test$suffix" "benchmark-bin/capture-test$suffix" "benchmark-bin/paradox$suffix" capture-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ runner.os }}-${{ runner.arch }}
          path: capture-report/
          if-no-files-found: error
          retention-days: 7
  passthrough-1:
    needs: test
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/passthrough-repeat.yml
    with:
      attempt: 1
      source: ${{ github.sha }}
  passthrough-2:
    needs: passthrough-1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/passthrough-repeat.yml
    with:
      attempt: 2
      source: ${{ github.sha }}
  passthrough-3:
    needs: passthrough-2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/passthrough-repeat.yml
    with:
      attempt: 3
      source: ${{ github.sha }}
  passthrough-gate:
    needs: [passthrough-1, passthrough-2, passthrough-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: passthrough-*
          path: passthrough-reports
      - run: python3 scripts/passthrough_ci.py aggregate passthrough-reports
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  watch-footprint:
    # Separate runners keep the ten-minute idle measurement independent of
    # functional/performance load. All jobs remain required for acceptance.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure watch RSS and CPU after ten minutes idle on 50,000 tracked files
        run: cargo test --release --locked --test watch -- --ignored --nocapture
