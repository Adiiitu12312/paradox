name: Build and test Paradox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p paradox-cli
      - name: Install Windows terminal test helper on hosted runner
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: "pywinpty>=3,<4"
      - name: Verify Windows terminal colors, pager, editor and Ctrl+C
        if: runner.os == 'Windows'
        run: python scripts/test_terminal.py target/${{ matrix.target }}/release/paradox.exe
      - name: Verify terminal colors, pager, editor and Ctrl+C
        if: runner.os != 'Windows'
        run: python3 scripts/test_terminal.py target/${{ matrix.target }}/release/paradox
      - uses: actions/upload-artifact@v4
        with:
          name: paradox-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/${{ matrix.target }}/release/paradox
            target/${{ matrix.target }}/release/paradox.exe
          if-no-files-found: error
          retention-days: 7
      - run: cargo test --release --test performance --locked -- --ignored --nocapture
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
