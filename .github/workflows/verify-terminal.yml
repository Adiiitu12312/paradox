name: Verify terminal fixture against an existing build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed build workflow run containing the exact release artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: paradox-Linux-X64
          - os: macos-15
            artifact: paradox-macOS-ARM64
          - os: windows-latest
            artifact: paradox-Windows-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: terminal-bin
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Restore Unix executable permissions
        if: runner.os != 'Windows'
        run: chmod +x terminal-bin/paradox
      - name: Install Windows terminal helper on the hosted runner
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: "pywinpty>=3,<4"
      - name: Record downloaded binary and fixture provenance
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        shell: bash
        run: |
          mkdir terminal-evidence
          python -c 'import hashlib,json,os,pathlib; p=pathlib.Path("terminal-bin")/("paradox.exe" if os.name=="nt" else "paradox"); data={"build_run":os.environ["BUILD_RUN"],"fixture_source":os.environ["GITHUB_SHA"],"binary_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}; pathlib.Path("terminal-evidence/provenance.json").write_text(json.dumps(data,indent=2)); print(data)'
      - name: Verify colors, pager, editor, child status and foreground watcher interruption
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python -u scripts/test_terminal.py "terminal-bin/paradox$suffix" 2>&1 | tee terminal-evidence/terminal.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-evidence-${{ runner.os }}-${{ runner.arch }}
          path: terminal-evidence/
          if-no-files-found: error
          retention-days: 7
