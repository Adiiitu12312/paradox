[package]
name = "paradox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fault-injection = ["paradox-core/fault-injection"]

[[bin]]
name = "paradox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
paradox-core.workspace = true
paradox-ui = { path = "../paradox-ui" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap.workspace = true
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
serde_json = "1"
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
