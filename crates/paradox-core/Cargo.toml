[package]
name = "paradox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fault-injection = []

[dependencies]
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
globset = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
similar = "2"
tempfile.workspace = true
toml = "0.9"
zstd = "0.13"

[dev-dependencies]
proptest.workspace = true
